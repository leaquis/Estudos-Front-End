<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalhando com Tabelas</title>
    <style>
      table {
        border: solid 1px gray;
      }
      table thead th {
        background-color: black;
        color: white;
      }
      table tfoot td {
        background-color: lightgray;
      }
      table tbody tr:nth-child(even) td {
        background-color: #f1f1f1;
      }
      table tbody tr:hover td {
        background-color: #e9e9e9;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <table
      summary="Essa tabela se refera ao nome e a idade das pessoas"
      width="250"
      align="center"
      cellspacing="0"
      cellpadding="5"
    >
      <thead>
        <tr>
          <th colspan="2">Minha Tabela</th>
        </tr>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
        </tr>
      </thead>
      <tbody>
        <tr id="1">
          <td>Giovani</td>
          <td>28</td>
        </tr>
        <tr id="2">
          <td>Roberta</td>
          <td>30</td>
        </tr>
        <tr id="3">
          <td>Fernanda</td>
          <td>18</td>
        </tr>
        <tr id="4">
          <td>Lucas</td>
          <td>30</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td>4</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
