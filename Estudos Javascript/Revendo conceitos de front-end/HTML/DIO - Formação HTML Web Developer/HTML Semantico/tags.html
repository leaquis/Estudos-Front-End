<html lang="pt-br">

    <title>Tags HTML 5 - Estrutural</title>
    <style>
      nav ul {
        display: flex;
        list-style: none;
        margin: 0;
      }

      nav ul li a {
        padding: 10px 15px;
        color: blue;
        text-decoration: none;
        border-radius: 8px;
      }

      nav ul li a:hover {
        color: white;
        background: blue;
      }

      blockquote {
        background: rgb(238, 237, 237);
        padding: 15px;
        margin-left: 0px;
        border-left: red solid 5px;
      }

      article time {
        font-style: italic;
      }

      article q {
        font-style: bold;
      }
    </style>
  </head>

    <header>
      <nav>
        <ul>

        </ul>

    </header>

      Main

      <br />

        <p>Pagina de estudo de article</p>
        <article>
          <p>teste de um article dentro de outro</p>
        </article>

        <blockquote cite="https://www.youtube.com/watch?v=-ANx41sZNIQ">
          <p>Busquem conhecimento</p>
        </blockquote>
